site_name: Profissional 2027
site_description: Programa gratuito de formação de Implementadores de Soluções de IA para PMEs brasileiras
site_author: Nei Maldaner — inema.vip
site_url: https://inematds.github.io/profissional2027/
repo_url: https://github.com/inematds/profissional2027
repo_name: inematds/profissional2027
edit_uri: edit/main/
copyright: Conteúdo livre para uso, adaptação e redistribuição. inema.vip · inema.club

docs_dir: docs
site_dir: site

exclude_docs: |
  metodo/templates/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/inematds
      name: GitHub inematds
    - icon: fontawesome/solid/globe
      link: https://inema.vip
      name: inema.vip
    - icon: fontawesome/solid/graduation-cap
      link: https://inema.club
      name: inema.club
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.keys

plugins:
  - search:
      lang: pt

